<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width-device-width, initial-scale=1" />
    <title>Contact| Corner Brew</title>
    <meta
      name="description"
      content="Small-batch coffee and fresh pastries, a short walk from home."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a href="index.html" class="logo">Corner Brew</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <h1>Find us</h1>
      <p>
        Questions, catering requests, or just want to say hi? Send us a message.
      </p>

      <form class="card" action="#">
        <div class="field">
          <label for="name">Your name</label>
          <input
            type="text"
            id="name"
            name="name"
            autocomplete="name"
            required
          />
        </div>
        <div class="field">
          <label for="emial">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          />
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit">Send message</button>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Corner Brew</p>
    </footer>
  </body>
</html>
